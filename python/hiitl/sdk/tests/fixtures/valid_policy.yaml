version: "v1.0.0"
description: "Allow transfers under $1000"
scope:
  org_id: "org_devlocal0000000000"
  environment: "dev"
name: test_policy_yaml
rules:
  - name: allow_small_amounts
    priority: 100
    conditions:
      field: parameters.amount
      operator: less_than
      value: 1000
    decision: ALLOW
    reason_code: SMALL_AMOUNT
    description: Allow transfers under $1000
