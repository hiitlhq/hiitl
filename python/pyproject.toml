[build-system]
requires = ["setuptools>=77.0"]   # PEP 639: `license` as an SPDX expression, `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "hiitl"
dynamic = ["version"]
description = "hiitl Execution Control Plane - Python SDK and Evaluator"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.7.0",
    "PyYAML>=6.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.30.0,<2.0.0",   # T-134: a tool result passed through whole (structured output); 2.x renamed McpError.
                            # 1.30: an SSE upstream follows a redirect only within its origin (sync_engine.md section 8)
]

[project.scripts]
hiitl-mcp-proxy = "hiitl.mcp_proxy.cli:main"

[tool.setuptools.dynamic]
version = {attr = "hiitl._version.__version__"}

[tool.setuptools.packages.find]
include = ["hiitl*"]
exclude = ["hiitl.server", "hiitl.server.*"]
