name: Publish TypeScript Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
      - name: Install the trusted-publishing npm CLI
        run: npm install --global npm@11.5.1
      - name: Build and publish @hiitl/core
        working-directory: typescript/packages/core
        run: |
          npm ci
          npm run build
          npm publish --access public
      - name: Build and publish @hiitl/sdk
        working-directory: typescript/packages/sdk
        run: |
          npm ci
          npm run build
          npm publish --access public
