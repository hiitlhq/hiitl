# Pattern Schema Reference
# This file documents the structure every pattern file must follow.
# It is not a JSON Schema — it is a human-readable format reference.

_schema_version: "1.0"

# Required fields
pattern_id: "category/action_name"      # Unique identifier (category/name)
category: "financial"                   # One of: financial, data_access, communication, iam, infrastructure, documents, classification, external
name: "Human Readable Name"            # Display name
description: "What this pattern covers" # 1-3 sentence description
tags: ["tag1", "tag2"]                 # Searchable tags

# SDK evaluate() examples — the call for this action in Python and TypeScript.
# The code after the call is illustrative.
evaluate_examples:
  python: |
    result = hiitl.evaluate("action_name", parameters={
        "param": "value",
    })
    if result.ok:
        execute_action()
  typescript: |
    const result = await hiitl.evaluate({
      action: 'action_name',
      parameters: { param: 'value' },
    });
    if (result.allowed) {
      await executeAction();
    }

# Context enrichment — additional fields that improve policy evaluation
context_enrichment:
  - field: "field_name"
    why: "Why this field matters for policy evaluation"
    example: "example_value"

# Starter policy rules for this action. Copy them into the `rules:` list of a policy
# file (a policy set needs `name`, `version` and `rules`). Under mode="RESPECT_POLICY"
# an action no rule matches is blocked (NO_MATCHING_RULE), so the set must also allow
# what the agent should do. Every rule needs a `description`.
#   lifecycle_stage: active (default) | staged | disabled | draft | archived
#   A RATE_LIMIT rule carries its window: rate_limit: {limit, window_seconds, scope}
#   (scope: action | agent | user | org | user_action).
#   remediation.type: field_restriction | threshold | scope | rate_limit | temporal | custom
starter_policies:
  - name: "rule-name"
    description: "What this rule does"
    priority: 100
    conditions:
      all_of:
        - field: "action"
          operator: "equals"
          value: "action_name"
        - field: "parameters.amount"
          operator: "greater_than"
          value: 500
    decision: "REQUIRE_APPROVAL"
    reason_code: "REASON_CODE"
    remediation:
      type: "threshold"
      message: "Why this was blocked and what to do"
      suggestion: "How to resolve"

  - name: "allow-rule-name"
    description: "What this rule lets through"
    priority: 50
    conditions:
      field: "action"
      operator: "equals"
      value: "action_name"
    decision: "ALLOW"
    reason_code: "ALLOW_REASON_CODE"

# Remediation examples — what developers see when actions are blocked
remediation:
  block_message: "Human-readable message explaining why blocked"
  developer_action: "What the developer should do to resolve"
  approval_message: "Message when approval is required"

# Compliance notes — relevant regulations and risk context
compliance:
  - regulation: "Regulation Name (e.g., PCI-DSS, GDPR)"
    relevance: "Why this regulation applies"
    note: "Specific compliance consideration"
