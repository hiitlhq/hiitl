name: test-policy
version: "v1.0.0"
description: "Allow transactions under $1000"
scope:
  org_id: "org_devlocal0000000000"
  environment: "dev"
rules:
  - name: allow-small-amounts
    description: Allow transactions under $1000
    priority: 100
    decision: ALLOW
    reason_code: SMALL_AMOUNT
    conditions:
      field: parameters.amount
      operator: less_than
      value: 1000
